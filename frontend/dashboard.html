<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Invoice Engine — Sign in</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/frontend/supabase-config.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #d8deea;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(96,124,255,.14),
                    transparent 45%
                ),
                #080b12;
        }

        .card {

            width: 100%;
            max-width: 430px;

            padding: 34px;

            border:
                1px solid #1c2636;

            border-radius: 18px;

            background:
                rgba(13,17,26,.94);

            box-shadow:
                0 25px 80px rgba(0,0,0,.35);
        }

        .brand {

            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 32px;

            font-size: 18px;
            font-weight: 700;
        }

        .brand-mark {

            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background:
                rgba(96,124,255,.12);

            border:
                1px solid rgba(96,124,255,.25);
        }

        h1 {

            font-size: 30px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #707b8e;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 5px;

            padding: 5px;

            margin-bottom: 24px;

            border-radius: 10px;

            background: #0a0e15;

            border: 1px solid #1c2636;
        }

        .tab {

            border: 0;

            padding: 10px;

            border-radius: 7px;

            cursor: pointer;

            background: transparent;

            color: #707b8e;

            font-weight: 600;
        }

        .tab.active {

            background: #151c29;

            color: #d8deea;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #a5afc0;

            font-size: 13px;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border-radius: 9px;

            border: 1px solid #1c2636;

            outline: none;

            background: #0a0e15;

            color: #d8deea;

            font-size: 14px;
        }

        input:focus {

            border-color: #607cff;

            box-shadow:
                0 0 0 3px rgba(96,124,255,.10);
        }

        .submit {

            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 9px;

            cursor: pointer;

            color: white;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #536fff,
                    #7564df
                );
        }

        .submit:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        .message {

            min-height: 20px;

            margin-top: 16px;

            font-size: 13px;

            line-height: 1.5;

            color: #a5afc0;
        }

        .back {

            display: block;

            margin-top: 24px;

            text-align: center;

            color: #707b8e;

            font-size: 13px;
        }

        .back:hover {

            color: #d8deea;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="brand">

        <div class="brand-mark">
            IE
        </div>

        Invoice Engine

    </div>


    <h1 id="title">
        Welcome back
    </h1>


    <p class="subtitle" id="subtitle">

        Sign in to continue to your invoice workspace.

    </p>


    <div class="tabs">

        <button
            class="tab active"
            id="signInTab"
            type="button"
        >
            Sign in
        </button>

        <button
            class="tab"
            id="signUpTab"
            type="button"
        >
            Create account
        </button>

    </div>


    <form id="authForm">


        <label for="email">
            Email
        </label>


        <input
            id="email"
            type="email"
            placeholder="you@example.com"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            id="password"
            type="password"
            placeholder="••••••••"
            minlength="6"
            required
        >


        <button
            class="submit"
            id="submitButton"
            type="submit"
        >

            Sign in

        </button>


    </form>


    <div
        class="message"
        id="message"
    ></div>


    <a
        class="back"
        href="/"
    >
        ← Back to Invoice Engine
    </a>


</div>


<script>

    const {
        createClient
    } = window.supabase;


    const client = supabaseClient;


    const authForm =
        document.getElementById("authForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const submitButton =
        document.getElementById("submitButton");


    const message =
        document.getElementById("message");


    const signInTab =
        document.getElementById("signInTab");


    const signUpTab =
        document.getElementById("signUpTab");


    const title =
        document.getElementById("title");


    const subtitle =
        document.getElementById("subtitle");


    let mode = "signin";


    function showMessage(text) {

        message.textContent = text;

    }


    function setMode(newMode) {

        mode = newMode;

        const signingIn =
            mode === "signin";


        signInTab.classList.toggle(
            "active",
            signingIn
        );


        signUpTab.classList.toggle(
            "active",
            !signingIn
        );


        title.textContent =
            signingIn
                ? "Welcome back"
                : "Create your account";


        subtitle.textContent =
            signingIn
                ? "Sign in to continue to your invoice workspace."
                : "Create an account to start using Invoice Engine.";


        submitButton.textContent =
            signingIn
                ? "Sign in"
                : "Create account";


        showMessage("");

    }


    signInTab.addEventListener(
        "click",
        function() {

            setMode("signin");

        }
    );


    signUpTab.addEventListener(
        "click",
        function() {

            setMode("signup");

        }
    );


    authForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            submitButton.disabled = true;


            showMessage(
                mode === "signin"
                    ? "Signing in..."
                    : "Creating account..."
            );


            try {


                if (mode === "signup") {


                    const {
                        data,
                        error
                    } = await client.auth.signUp({

                        email,
                        password,

                        options: {

                            emailRedirectTo:
                                window.location.origin +
                                "/frontend/dashboard.html"

                        }

                    });


                    if (error) {

                        throw error;

                    }


                    if (data.session) {

                        window.location.href =
                            "/frontend/dashboard.html";

                        return;

                    }


                    showMessage(
                        "Account created. Check your email to confirm your account."
                    );


                } else {


                    const {
                        data,
                        error
                    } = await client.auth.signInWithPassword({

                        email,
                        password

                    });


                    if (error) {

                        throw error;

                    }


                    if (!data.session) {

                        throw new Error(
                            "Login succeeded but no session was returned."
                        );

                    }


                    window.location.href =
                        "/frontend/dashboard.html";

                }


            } catch (error) {


                console.error(
                    "Authentication error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Authentication failed."
                );


            } finally {

                submitButton.disabled = false;

            }

        }
    );


    async function checkExistingSession() {


        try {


            const {
                data
            } = await client.auth.getSession();


            if (
                data &&
                data.session
            ) {

                window.location.href =
                    "/frontend/dashboard.html";

            }


        } catch (error) {

            console.error(
                "Session check failed:",
                error
            );

        }

    }


    checkExistingSession();

</script>


</body>

</html>
